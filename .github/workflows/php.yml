name: php

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: find config pages -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/password_matches_test.php
